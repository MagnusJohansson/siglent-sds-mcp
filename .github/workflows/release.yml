name: Release

# Publishing a GitHub Release is the single trigger for publishing: the
# release notes exist before anything ships, and a draft publishes nothing.
#
# verify -> npm -> docker. Nothing is published unless every check and test
# passes, and the Docker image only ships once the npm package has: an npm
# version can't be republished, a failed image push can be re-run.
on:
  release:
    types: [published]

# Read-only by default; each job adds only what it needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the "tag is on master" check
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Check the release against the repository
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          version="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            fail "Release tag $GITHUB_REF_NAME does not match package.json version v$version."

          server_version="$(sed -n 's/^export const SERVER_VERSION = "\(.*\)";$/\1/p' src/server.ts)"
          [ "$server_version" = "$version" ] ||
            fail "SERVER_VERSION in src/server.ts is '$server_version', package.json says $version."

          # npm rejects a provenance-signed publish unless repository.url
          # matches this repository exactly, including case.
          expected_url="git+https://github.com/${GITHUB_REPOSITORY}.git"
          actual_url="$(node -p "require('./package.json').repository.url")"
          [ "$actual_url" = "$expected_url" ] ||
            fail "package.json repository.url is $actual_url, expected $expected_url."

          # The "pre-release" checkbox decides the npm dist-tag and whether
          # Docker moves "latest"; it has to agree with the version.
          case "$version" in
            *-*) [ "$PRERELEASE" = "true" ] ||
                   fail "$version is a pre-release version, but the release isn't marked as a pre-release." ;;
            *)   [ "$PRERELEASE" = "false" ] ||
                   fail "$version is a stable version, but the release is marked as a pre-release." ;;
          esac

          git merge-base --is-ancestor "$GITHUB_SHA" origin/master ||
            fail "The release tag points to a commit that isn't on master."

      # --ignore-scripts: no dependency needs an install script, and none
      # should run code during a release.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 bundles npm 11.20, which supports trusted publishing (needs
          # >= 11.5.1). No separate npm install: it would be an unpinned download.
          node-version: 26
          registry-url: https://registry.npmjs.org

      # This job holds the OIDC token, so dependency install scripts must not run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # prepublishOnly builds the package. Pre-releases go to the "next"
      # dist-tag so they don't become "latest".
      - name: Publish
        run: npm publish --provenance --access public ${{ github.event.release.prerelease && '--tag next' || '' }}

  docker:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The semver rules would add "latest" automatically, even for a release
          # marked as a pre-release. Only the gated raw rule below may set it.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      # No build cache: a release is built once, and a shared cache could be
      # poisoned by another workflow run.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
